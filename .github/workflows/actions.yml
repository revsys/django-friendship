name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: true
      PYTHONPATH: example
    strategy:
      # By default, GitHub will maximize the number of jobs run in parallel
      # depending on the available runners on GitHub-hosted virtual machines.
      # max-parallel: 8
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
        django-version:
          - "4.2"  # LTS
          - "5.1"
          - "5.2"  # LTS
          - "6.0"
          - "6.1"
        exclude:

          # Django 6.0 is compatible with Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
          # Django 6.1 is compatible with Python 3.12+
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.1"
          # Django 4.2 is not compatible with Python 3.14+
          - python-version: "3.14"
            django-version: "4.2"
          - python-version: "3.14t"
            django-version: "4.2"
          # Django 5.1 is not compatible with Python 3.14+
          - python-version: "3.14"
            django-version: "5.1"
          - python-version: "3.14t"
            django-version: "5.1"
          # Django 4.2 and 5.1 are not compatible with Python 3.15 either
          - python-version: "3.15"
            django-version: "4.2"
          - python-version: "3.15t"
            django-version: "4.2"
          - python-version: "3.15"
            django-version: "5.1"
          - python-version: "3.15t"
            django-version: "5.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15 has no final release yet. Harmless for the others, and can be
          # dropped once 3.15 ships.
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: '**/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install uv

      - name: Resolve Django ${{ matrix.django-version }} specifier
        run: |
          # Django versions without a final release need a specifier that opts
          # in to pre-releases. Naming the pre-release also lets the same spec
          # pick up the final release once it ships, so these cases can just be
          # dropped then.
          case "${{ matrix.django-version }}" in
            6.1) echo 'DJANGO_SPEC=Django>=6.1rc1,<6.2' >> "$GITHUB_ENV" ;;
            *)   echo 'DJANGO_SPEC=Django~=${{ matrix.django-version }}.0' >> "$GITHUB_ENV" ;;
          esac

      - name: Install Django ${{ matrix.django-version }}
        run: |
          python -m uv pip install --system "$DJANGO_SPEC"

      - name: Install dependencies
        run: |
          python -m uv pip install --system -e ".[test]"

      - run: |
          pytest .
